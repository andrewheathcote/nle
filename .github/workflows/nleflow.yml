name: nleflow

on:
  push:
    branches: [nleflow-plan]
  workflow_dispatch:

jobs:
  python-tests:
    # nleflow's Python tests without R: the R-dependent cases skip (NLEFLOW_RLIB / NLEFLOW_EMC2_LIB unset)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nleflow
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install from the lock
        run: uv sync --frozen --group dev
      - name: pytest
        run: uv run pytest -rs -q

  # The container (nleflow/docker/Dockerfile) is checked locally, not here: DMC2 is private, so the
  # image is built from an R CMD build tarball of it (docs/install-and-check.md, section 4).
