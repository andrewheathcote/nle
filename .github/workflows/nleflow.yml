name: nleflow

on:
  push:
    branches: [nleflow-plan]
  workflow_dispatch:

jobs:
  python-tests:
    # nleflow's Python tests without R: the R-dependent cases skip (NLEFLOW_RLIB / NLEFLOW_EMC2_LIB unset)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nleflow
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install from the lock
        run: uv sync --frozen --group dev
      - name: pytest
        run: uv run pytest -rs -q

  container:
    # the image of nleflow/docker/Dockerfile: R >= 4.5, EMC2 dev-flow, the lock; its three checks
    runs-on: ubuntu-latest
    needs: python-tests
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f nleflow/docker/Dockerfile -t nleflow .
      - name: nle-verify
        run: docker run --rm nleflow nle-verify
      - name: pytest with the R checks
        run: docker run --rm nleflow pytest -q
      - name: EMC2's own tests (x86_64)
        run: docker run --rm nleflow emc2-tests
