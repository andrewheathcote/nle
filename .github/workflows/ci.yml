name: ci

on:
  push:
  pull_request:

jobs:
  flow-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install flow package + test deps
        working-directory: flow
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run smoke test
        run: pytest -q flow/tests/test_smoke.py
