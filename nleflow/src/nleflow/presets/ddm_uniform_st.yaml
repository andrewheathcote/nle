# HSSM's DDM with uniform non-decision-time variability, the "ddm-st-lans"
# likelihood approximation network (LAN). A preset says what an ONNX graph
# cannot: what the inputs mean, on what scale, over what box, and how the
# network's parameters map onto an EMC2 model. Every value here was checked;
# the `checked` block says against what.
name: ddm_uniform_st
source_model: "huggingface.co/Eitanm/ddm-st-lans :: ddm_uniform_st.onnx"
# The source replaced its network under the same name; the converter knows each
# published file by sha256 and takes that version's box (overriding `box` below).
# Download one by revision: https://huggingface.co/Eitanm/ddm-st-lans/resolve/<revision>/ddm_uniform_st.onnx
versions:
  - revision: 40e0327c22a4          # current (main as of 2026-10-19)
    date: 2026-10-05
    network: "5 x 100 tanh, 1.47 M parameter sets"
    sha256: 4330d72313b322ba9799bad1017180e62a82a7dfc58944826ac54efccab1d173
    box: {st: [0.001, 0.35]}
    checked: >-
      box from the model card (README.md at 8c4f5a081c0b, "Training box": v, a, z, t as below, st
      0.001 to 0.35); same parameters, order, kernel (Uniform(t - st, t + st)) and label floor (-16.118);
      the mapping onto EMC2's DDM re-checked on this file by nleflow/examples/lan_in/check_in_emc2.R
  - revision: 8b1be7830fa5          # the first published file, superseded
    date: 2026-09-20
    network: "3 x 100 tanh"
    sha256: a9acbc4a238ff5df8ef53fda5bb0d89d20e4e23c3fc862ae25888739c99dc63f
    box: {st: [0.001, 0.25]}
    note: "superseded; a copy is nleCards/ddm_uniform_st.onnx (the converter's tests)"
params: [v, a, z, t, st]            # the network's parameter inputs, in its order
input_layout: [v, a, z, t, st, rt, R]
transforms: {v: identity, a: identity, z: identity, t: identity, st: identity}   # raw inputs, no standardisation
box:                                # the training box (natural scale; st per version); rows outside get ll_floor
  v: [-3.0, 3.0]
  a: [0.3, 2.5]
  z: [0.3, 0.7]
  t: [0.25, 2.25]
  st: [0.001, 0.25]
ll_floor: -16.11809565095832        # log(1e-7): the floor of the network's training labels
response_values: [-1.0, 1.0]        # network input for EMC2's responses 1 (lower) and 2 (upper)
encoding: "input = [v,a,z,t,st,rt,choice] with choice in {+1,-1}; no standardisation"
twin: DDM                           # the EMC2 model the mapping lands on
map_to_emc2_ddm: "a_EMC2 = 2*a_lan; Z = z; t0 = t - st; st0 = 2*st; sv = 0; SZ = 0; s = 1"
mapping:                            # the same, structured: EMC2 DDM parameter <- expression in the LAN's
  v: v
  a: 2 * a
  Z: z
  t0: t - st
  st0: 2 * st
  sv: "0"
  SZ: "0"
  s: "1"
emc2_p_types: {v: 0, a: 1, z: 0.5, t: 0.5, st: 0.05}   # register_nn_model(card, p_types = ...): no twin defaults
checked:
  mapping: >-
    determined empirically against WienR and verified to 4.3e-7; recovered as the best agreement by a
    profile scan over a, t0, st0, Z and v in EMC2's tests/testthat/test-nn-mlp.R, which also rejects the
    three wrong mappings
    (a not doubled, t as the lower end, responses swapped)
  box_v_a: >-
    equal to HSSM's own DDM LAN box, v in (-3, 3) and a in (0.3, 2.5)
    (github.com/lnccbrown/HSSM, src/hssm/modelconfig/ddm_config.py, approx_differentiable, main as of 2026-10-17)
  box_z_t_st_floor: >-
    from the network's source repository (huggingface.co/Eitanm/ddm-st-lans): the model card's
    "Training box" and label floor, as under versions
  sha256: per version above (the 3 x 100 file is nleCards/ddm_uniform_st.onnx)
