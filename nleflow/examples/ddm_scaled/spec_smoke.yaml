# The smoke configuration of spec.yaml: 1 % of the data, 2 epochs, the classifier
# at its full 194 epochs on 2000 rows; end to end in a few minutes on 4 cores.
name: ddm_scaled_smoke
model: DDM                        # the analytic twin; the card's model is DDMsc
response: choice
context: [kappa, eta, Z, SZ]
transforms: {kappa: identity, eta: zerobox, Z: probit, SZ: zerobox}
zerobox_c: {eta: 0.01, SZ: 0.05}
stored: {eta: log, SZ: probit}    # the data store log eta and probit SZ, -Inf at 0
box_natural:
  kappa: [-10, 10]
  eta: [0, 8]
  Z: [0.1, 0.9]
  SZ: [0, 0.99]
sampling:                         # the free draws (simulation/scaled.R)
  kappa: [{kind: uniform, share: 0.5}, {kind: uniform, share: 0.5, range: [-3, 3]}]
  eta: [{kind: log_uniform, share: 0.75, range: [0.01, 8]}, {kind: asinh_uniform, share: 0.25}]
  Z: [{kind: uniform, share: 1}]
  SZ: [{kind: asinh_uniform, share: 1, range: [0.05, 0.99]}]
regimes:                          # which inputs are exactly 0, jointly
  - {share: 0.55}
  - {share: 0.15, zero: [eta]}
  - {share: 0.15, zero: [SZ]}
  - {share: 0.15, zero: [eta, SZ]}
scaling: {kind: ddm_unit, sz: proportion}
spline: {bins: 64, range: [-12, 2]}   # log u; set from the pilot data
conditioner: {widths: [256, 128], norm: false, affine: false}
classifier: {widths: [256, 256, 256], lr: 1.491898934850391e-3, batch: 256, epochs: 194, loss: mse}
training:
  rows: 240000                   # 1 %: 6000 draws x 40
  val_rows: 10000                 # 250 draws x 40
  trials_per_draw: 40
  choice_rows: 2000
  choice_val_rows: 200
  batch: 1024
  epochs: 2
  keep: 2
  peak_lr: 1.0e-4
  seed: 1106                      # the selected seed, s1106
data: {train: data_smoke/train, val: data_smoke/val, choice_train: data_smoke/choice/train.csv, choice_val: data_smoke/choice/val.csv}
simulator: Rscript simulate.R     # needs EMC2 (NLEFLOW_RLIB), WienR, jsonlite; arrow for parquet
mass_tolerance: 1.0e-3
